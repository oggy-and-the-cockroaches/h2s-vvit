name: CivicPulse AI CI/CD & Automated Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    name: Run Test Suite, Security Checks & Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=backend/app --cov-report=term-missing

      - name: Validate Accessibility & HTML Structure
        run: |
          pytest tests/test_html_accessibility.py -v
